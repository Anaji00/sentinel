services:
  ingress:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: sentinel-ingress
    restart: unless-stopped
    ports:
      # Loopback by default: without an explicit address Docker publishes on
      # every interface, including untrusted networks. A public deployment must
      # opt in with SENTINEL_BIND=0.0.0.0, which is also required for Let's
      # Encrypt to reach the ACME challenge path on port 80.
      - "${SENTINEL_BIND:-127.0.0.1}:80:80"
      - "${SENTINEL_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificates live on the host, not inside the image. Without this a real
      # certificate is destroyed on every container recreate and silently
      # replaced by a fresh self-signed one.
      - ./deploy/nginx/ssl:/etc/nginx/ssl
      # ACME webroot: certbot writes the challenge token here, nginx serves it.
      - ./deploy/nginx/certbot:/var/www/certbot
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # 16.6 MiB observed against 256M. Eight times the measured working
          # set is still generous for a reverse proxy.
          memory: 128M
        reservations:
          memory: 64M
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_started

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sentinel-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok"
      # Heap capped under the cgroup limit so the JVM garbage-collects
      # instead of being OOM-killed by the kernel.
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx192m"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    healthcheck:
      test: echo ruok | nc localhost 2181 | grep imok
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sentinel-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      # 768m heap inside a 1.5G container leaves room for direct buffers,
      # mmap'd log segments and JVM overhead.
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
      # Bound the log so an idle week cannot fill the volume.
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 2147483648
      KAFKA_LOG_SEGMENT_BYTES: 268435456
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-ui:
    profiles: ["obs"]
    image: provectuslabs/kafka-ui:latest
    container_name: sentinel-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinel-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  timescaledb:
    build:
      context: .
      dockerfile: Dockerfile.timescale
    container_name: sentinel-timescaledb
    restart: unless-stopped
    environment:
      # Interpolated from host .env variables.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Sized for the 2G cgroup limit. Without these Postgres uses compiled
    # defaults and work_mem is allocated per sort node per connection --
    # the classic way a cgroup-limited container still gets OOM-killed.
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=60
      -c shared_buffers=512MB
      -c effective_cache_size=1200MB
      -c maintenance_work_mem=128MB
      -c work_mem=8MB
      -c max_worker_processes=8
      -c max_parallel_workers=4
      -c max_parallel_workers_per_gather=2
      -c timescaledb.max_background_workers=4
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./shared/db/init.sql:/docker-entrypoint-initdb.d/01_schema.sql
    deploy:
      resources:
        limits:
          cpus: '2.0'
          # Measured 143MiB. shared_buffers=512M is the real floor here,
          # plus work_mem*max_connections worst case -- 1.5G covers both.
          memory: 1.5G
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:5.13
    container_name: sentinel-neo4j
    restart: unless-stopped
    environment:
      # Parameterized auth from .env.
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      # Severely restrict APOC execution. Removes apoc.export.* and apoc.load.* # which are common attack vectors for Remote Code Execution / Host file exfiltration.
      NEO4J_dbms_security_procedures_unrestricted: apoc.meta.*,apoc.algo.*,apoc.spatial.*,apoc.coll.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_dbms_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    # RDB snapshots disabled, and maxmemory below the container limit.
    #
    # Redis was killed by its own cgroup 65 times:
    #
    #   Memory cgroup out of memory: Killed process (redis-server)
    #   anon-rss:783688kB          (~765MB)
    #   constraint=CONSTRAINT_MEMCG (the 768M container limit)
    #
    # maxmemory governs the dataset, not process RSS. With appendonly *and* the
    # default save points, "10000 changes in 60 seconds. Saving..." fired
    # continuously under write load, and each RDB fork's copy-on-write adds
    # close to the dataset size again. 512MB of data plus a fork exceeds a
    # 768MB ceiling, so the kernel took it -- with no shutdown log, which is why
    # the restarts looked like nothing at all.
    #
    # Every restart cost the caches, and much of this audit was spent chasing
    # the symptoms: predictions gone, the macro cache empty, quotes down to six
    # keys, aircraft:last_seen at zero. AOF still provides durability; the
    # snapshots were redundant beside it.
    # Eviction policy: volatile-lru, not allkeys-lru.
    #
    # allkeys-lru evicts anything, including state the system means to keep
    # forever. Verified live during market hours: used_memory peaked at 744MB
    # against this 512MB cap and 83,289 keys were evicted, taking with them
    # every recorded prediction, sentinel:equities:valid_set (the universe
    # backing ticker confirmation) and the earnings cache. A prediction is
    # written once and read at resolution 24 hours later, which makes it
    # exactly what an LRU gives up first -- so "one prediction, ever" was
    # partly a measurement of eviction rather than of the agents.
    #
    # volatile-lru confines eviction to keys carrying a TTL, which are the
    # ones whose authors said they were disposable. Keys with no TTL are then
    # never silently dropped; if memory is exhausted with nothing volatile
    # left, writes fail loudly instead, which is a failure that can be seen.
    #
    # The 512mb cap is left alone deliberately: the observed peak is 45% over
    # it, so raising it is a host-memory decision rather than a config tidy.
    command: >
      redis-server --appendonly yes --save "" --maxmemory 400mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # 1G, not 768M, because maxmemory sizes the dataset and the kernel
          # kills the process.
          #
          # Redis was killed repeatedly at ~765MB RSS against a 768MB ceiling
          # while holding a 400MB dataset. Disabling RDB snapshots did not stop
          # it: Redis 7 uses a multi-part AOF whose base is an RDB file, so the
          # AOF rewrite forks exactly as bgsave did -- "RDB is base AOF" in its
          # own startup log -- and that fork's copy-on-write is the missing
          # 365MB. Base 127MB against current 193MB, rewriting at 100% growth,
          # means it forks often under this write volume.
          #
          # The usual sizing for a forking Redis is twice maxmemory. 400MB of
          # data in a 1G container is that, with room for the AOF buffers.
          memory: 1G
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} ping || exit 1
      interval: 5s
      timeout: 3s
      retries: 15

  migrator:
    build: .
    command: python shared/db/migrate.py
    environment:
      - PYTHONPATH=/app
    env_file: .env
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      timescaledb:
        condition: service_healthy

  enrichment:
    build:
      context: .
      dockerfile: ml.Dockerfile
    # No fixed container_name: enrichment is the pipeline's throughput ceiling and
    # must be scalable with `docker compose up -d --scale enrichment=N`, which
    # Docker refuses for a service with a fixed name. Nothing references it by
    # name -- addressing is by service name on the compose network.
    command: python services/enrichment/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          # Raised from 1.5. Enrichment was the narrowest point in the pipeline
          # at ~12 events/s against 22/s of production, and it is CPU-bound:
          # scoring, sanctions matching and payload construction per event.
          cpus: '4.0'
          memory: 1.5G
    depends_on:
      migrator:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  correlation:
    build:
      context: .
      dockerfile: ml.Dockerfile
    container_name: sentinel-correlation
    command: python services/correlation/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          # Raised from 1.5. Correlation is CPU-bound on sentence-transformer
          # encoding (~945ms/event single, ~454ms batched) and was pinned at its
          # ceiling while its lag grew.
          cpus: '3.0'
          # Raised from 1.5G, which the kernel was enforcing 231 times:
          #
          #   Memory cgroup out of memory: Killed process (python)
          #   anon-rss:1545464kB   constraint=CONSTRAINT_MEMCG
          #
          # This service loads a sentence-transformer alongside the statistical
          # discovery engine, the peer derivation and the Hawkes refit, and its
          # working set crosses 1.5G during a scan. Every kill restarts the
          # model load and discards whatever the scan had accumulated.
          #
          # The headroom is real rather than borrowed: the whole stack occupies
          # 5.3 GiB of a 25.44 GiB VM, so these limits are ceilings that guard
          # against a simultaneous peak the deployment has never approached.
          memory: 2.0G
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      qdrant:
        condition: service_started

  reasoning:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: ml.Dockerfile
    container_name: sentinel-reasoning
    command: python services/reasoning/main.py
    env_file: .env
    environment:
      - SENTINEL_SERVICE=reasoning
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          # Measured 124MiB. Orchestrates via HTTP; holds nothing large.
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  collector-tradfi:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-tradfi
    command: python services/collector-tradfi/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector-crypto:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-crypto
    command: python services/collector-crypto/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector-prediction:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-prediction
    command: python services/collector-prediction/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  ollama:
    profiles: ["agents"]
    image: ollama/ollama:latest
    container_name: sentinel-ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      # One slot: this CPU serves ~3-5 tok/s, so four concurrent contexts
      # quarter throughput and quadruple the KV cache.
      - OLLAMA_NUM_PARALLEL=1
      # Pinned deliberately. A cold load costs ~15s on CPU and the agent
      # tiers are called in bursts, so residency is worth 2.9 GB of the
      # ~16 GB headroom. Set to a duration (e.g. 5m) to reclaim it instead.
      - OLLAMA_KEEP_ALIVE=-1
      # One resident model, because the tiers now request the same one.
      #
      # Two resident models meant two runner processes, and each was started
      # with NumThreads:6 against this service's 6-core quota -- twelve
      # llama.cpp compute threads on six cores. Measured: 263% + 243% CPU, 506%
      # of the 600% available, with 87 and 57 minutes of CPU time accumulated in
      # 35 minutes of wall clock. llama.cpp threads busy-wait at a barrier, so
      # oversubscription does not degrade linearly, it collapses: an eight-token
      # request did not return in nine minutes, and every agent and reasoning
      # inference hit the 600s client timeout having produced nothing.
      #
      # The earlier reasoning for =2 was sound for the configuration it
      # described (alternating requests for different models evicting each
      # other). Consolidating the tiers onto one model removes the alternation
      # instead, which is strictly better than paying for both.
      - OLLAMA_MAX_LOADED_MODELS=1
      # f16, not q8_0. A quantised KV cache trades CPU for memory: every
      # attention step dequantises. That is the right trade on a GPU short of
      # VRAM and the wrong one here, where cycles are the scarce resource and
      # the host has ~15 GB available.
      - OLLAMA_KV_CACHE_TYPE=f16
    deploy:
      resources:
        limits:
          # Six, matching OLLAMA_NUM_THREAD in .env and the VM's six physical
          # cores. tests/test_inference_thread_sizing.py pins the two together.
          #
          # Both halves of that pairing were raised and measured, and both were
          # reverted. Raising the quota alone to 12 did nothing: the thread pool
          # is what determines usage and it was already matched. Raising the
          # pool to 12 against 6 physical cores wedged the server in under six
          # minutes -- no completions, no healthchecks, 624% CPU, in-flight
          # requests at 4m59s against a 157s baseline -- because llama.cpp
          # busy-waits at a thread barrier, so oversubscription collapses rather
          # than degrades. That is the incident already described above,
          # reproduced by someone who had just read it.
          #
          # Widening the VM to all 8 physical cores and running 8 threads did
          # work, and made the system slower anyway:
          #
          #     6 physical / 6 threads    43.3 inferences/hr   mean 157.4s
          #     8 physical / 8 threads    34.0 inferences/hr   mean 168.0s
          #
          # The two cores were never idle -- they were running the other
          # twenty-five containers. Giving them to the model server starved the
          # pipeline that feeds it. See .wslconfig for the full note.
          cpus: '6.0'
          # 5G, raised from 4G. MAX_LOADED_MODELS=2 above asks for two
          # resident models and they did not fit: ollama reported
          # total="4.0 GiB" free="1.0 GiB" and then, for every qwen2.5:3b
          # request, "model requires more system memory than is currently
          # available, evicting a model to make space"
          # required=1999443968 free=1084825600 -- followed by a 47.86s
          # reload. The two tiers evicted each other in turn, so most of the
          # budget went on loading rather than answering.
          #
          # 4.5G, trimmed from 5G to fund the correlation service, which the
          # kernel was killing 231 times at its own ceiling while this one has
          # never been observed above 1.9 GiB. The reasoning below is unchanged
          # and still holds with the half gigabyte removed: qwen2.5:3b (1.9 GB)
          # plus qwen2.5:1.5b (1.0 GB) is 2.9 GB of weights, one resident model
          # measured 2.22 GiB including KV cache and runtime, and 4.5G leaves
          # 1.6 GB above the both-models figure.
          memory: 4.5G
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sentinel-qdrant
    environment:
      QDRANT__LOG_LEVEL: WARN
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      disable: true

  collector-cyber:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-cyber
    command: python services/collector-cyber/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  collector-radar:
    profiles: ["collectors"]
    build: .
    command: "python services/collector-radar/main.py"
    container_name: sentinel-radar
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  collector-filings:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-filings
    command: python services/collector-filings/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          # Polls SEC EDGAR's submissions JSON on a 90 second cycle and keeps a
          # small watchlist of CIKs. The documents are not downloaded, only the
          # filing index, so this stays modest.
          memory: 256M

  collector-sar:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-sar
    command: python services/collector-sar/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          # The imagery never lands here. openEO submits a process graph,
          # Copernicus reduces the raster on its own infrastructure, and what
          # returns is an aggregate small enough to iterate. One sweep a day.
          memory: 192M

  collector-ais:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-ais
    command: python services/collector-ais/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector-adsb:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-adsb
    command: python services/collector-adsb/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector-news:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-news
    command: python services/collector-news/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The enrichment pipeline has subscribed to events.raw.social since it was
  # written -- Topics.RAW_SOCIAL is in its consumer list and routed to the news
  # enricher, which branches on source_type "primary_social" to emit
  # SOCIAL_SIGNAL rather than HEADLINE. Nothing ever published to that topic,
  # because this collector had no service definition: a complete OSINT source
  # (Telegram public channels, Reddit JSON feeds, an RSS bridge, no API keys
  # required) sat unrun while a whole branch of the enricher waited for it.
  collector-social:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-social
    command: python services/collector-social/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector-macro:
    profiles: ["collectors"]
    build: .
    container_name: sentinel-macro
    command: python services/collector-macro/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build: .
    container_name: sentinel-api_gateway
    # No --reload: the source tree is bind-mounted, so the reloader watched every
    # file under ./services and restarted the gateway whenever an unrelated
    # service was edited. Its shutdown then hung on a background task
    # ("Waiting for background tasks to complete"), leaving the gateway pinned
    # at ~90% CPU and timing out /health while the container still reported
    # running. Restart explicitly to pick up code changes.
    command: uvicorn services.api_gateway.routes.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 15
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          # Measured 185MiB serving live traffic.
          memory: 768M
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, urllib.request; r = urllib.request.Request('http://localhost:8000/api/v1/health/', headers={'X-API-KEY': os.environ.get('API_GATEWAY_KEY','')}); urllib.request.urlopen(r)" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      timescaledb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  agents-fast:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: ml.Dockerfile
    container_name: sentinel-agents-fast
    command: python services/agents/main.py
    env_file: .env
    environment:
      # Distinct per replica: metrics are published to sentinel:metrics:{name},
      # so two tiers sharing a name would overwrite each other's counters and
      # the inference accounting would be wrong in a quieter way than having
      # none at all.
      - SENTINEL_SERVICE=agents-fast
      - AGENT_TIER_FILTER=fast
      - AGENT_MODEL=qwen2.5:1.5b
      - OLLAMA_FALLBACK_MODEL=gemma3:1b
      - OLLAMA_TIMEOUT=600.0
      - OLLAMA_KEEP_ALIVE=-1
      - PYTHONWARNINGS=ignore::UserWarning
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          # Measured 550MiB (includes the SentenceTransformer encoder).
          memory: 1G
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy

  agents-heavy:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: ml.Dockerfile
    container_name: sentinel-agents-heavy
    command: python services/agents/main.py
    env_file: .env
    environment:
      - SENTINEL_SERVICE=agents-heavy
      - AGENT_TIER_FILTER=heavy
      # 3b, not 7b: on a 15W Zen 2 part 7b yields ~3-5 tok/s, and keeping it
      # resident alongside the fast tier exceeds the VM memory budget.
      # Same model as agents-fast, deliberately.
      #
      # A separate 3b for this tier bought better answers in principle and none
      # in practice: it forced a second resident runner, the two oversubscribed
      # the CPU quota, and both tiers then timed out at 600s having produced
      # nothing. A 1.5b that answers is worth more than a 3b that does not.
      #
      # Revisit if this deployment gets a GPU or a larger CPU allocation, where
      # the two runners would no longer contend.
      - AGENT_MODEL=qwen2.5:1.5b
      - OLLAMA_FALLBACK_MODEL=qwen2.5:1.5b
      - OLLAMA_TIMEOUT=600.0
      - OLLAMA_KEEP_ALIVE=-1
      - PYTHONWARNINGS=ignore::UserWarning
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.5'
          # No in-process model weights: agents call ollama over HTTP.
          # Measured 705MiB running alongside collectors. Agents hold no
          # model weights -- those live in ollama -- so this is a Kafka
          # consumer footprint. 1.25G retains ~1.8x headroom.
          memory: 1.25G
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    environment:
      - API_GATEWAY_URL=http://api-gateway:8000
      # NEXT_PUBLIC_API_URL intentionally unset: the browser reaches REST via the
      # same-origin /api/proxy BFF and WebSockets via the same-origin ingress host.
      # A hardcoded http://localhost:8000 here breaks both (port not published +
      # mixed content on HTTPS). Set it only to an explicit public origin if needed.
      - API_GATEWAY_KEY=${API_GATEWAY_KEY:?API_GATEWAY_KEY must be set}
      # The login route mints the sentinel_session cookie with this secret and
      # the API gateway verifies it with the same one -- they MUST match. It was
      # absent from this container, so /api/auth/login failed closed with
      # "Authentication is not configured" (HTTP 500), no cookie was ever issued,
      # and every WebSocket handshake was rejected 403 -- the dashboard sat on
      # "stream connecting..." forever.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set and match the gateway}
      # The login route compares submitted credentials against these. They were
      # absent from this container, so the password branch was skipped entirely
      # and every sign-in returned 401 "Invalid corporate credentials" even when
      # the credentials were correct. This service enumerates its environment
      # explicitly (no env_file), so anything the app reads must be listed here.
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      # ADMIN_PASSWORD is deliberately NOT passed here any more. Passwords are
      # verified by the gateway against scrypt hashes in the users table, so no
      # password secret needs to exist in the public-facing web process.
      - SENTINEL_ENV=${SENTINEL_ENV:-production}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # Measured 30MiB under live load. Next.js standalone does not
          # grow with traffic; 512M retains ~17x headroom.
          # 47.6 MiB observed against 512M, a production Next.js build
          # serving static output.
          memory: 384M
    depends_on:
      api-gateway:
        condition: service_healthy

  dlq-worker:
    build: .
    container_name: sentinel-dlq-worker
    command: python services/dlq-worker/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  telemetry-worker:
    build:
      context: .
      dockerfile: ml.Dockerfile
    container_name: sentinel-telemetry-worker
    command: python services/telemetry-worker/main.py
    env_file: .env
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      api-gateway:
        condition: service_healthy

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - prometheus

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  timescaledb_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  ollama_data:
  qdrant_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: sentinel-network
