name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      # Identical to verify.yml.
      #
      # These two workflows ran the same suite under different environments:
      # ci.yml set only SENTINEL_ENV and PYTHONPATH, while verify.yml also
      # supplied SESSION_SECRET and API_GATEWAY_KEY. The gateway resolves
      # SESSION_SECRET with required=True at import, so any test touching auth
      # behaved differently between the two -- and a test that passes in one
      # workflow and not the other teaches people to trust whichever was green.
      SENTINEL_ENV: test
      SESSION_SECRET: ci-only-not-a-real-secret-000000
      API_GATEWAY_KEY: ci-only-not-a-real-secret-111111
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-base.txt
          pip install -r requirements-ml.txt
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check --output-format=github .

      - name: Run tests
        run: pytest tests/ -v --tb=short
