<!doctype html>
<!--
  Served by the service worker when a page cannot reach the server.
  A static file, not a route: the middleware skips paths with an extension, so
  the worker can precache it while the user is still signed out, and it carries
  no user data. Colours mirror the --bg-base / --accent tokens in globals.css.
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f17">
  <title>Offline — Sentinel</title>
  <style>
    :root { --bg: #0b0f17; --raised: #111722; --ink: #eef2f8; --muted: #a6b3c6; --accent: #8b9dff; --on-accent: #0b0f17; --line: rgba(160, 174, 200, 0.13); }
    :root[data-theme="light"] { --bg: #f3f5f9; --raised: #ffffff; --ink: #121826; --muted: #3f4b60; --accent: #4152c9; --on-accent: #ffffff; --line: rgba(30, 42, 70, 0.12); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--ink);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 360px; width: 100%; padding: 24px; border: 1px solid var(--line);
           border-radius: 12px; background: var(--raised); text-align: center; }
    img { width: 56px; height: 56px; border-radius: 12px; }
    h1 { font-size: 18px; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; cursor: pointer;
             background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; }
  </style>
  <script>
    try { if (localStorage.getItem('sentinel.theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Sentinel shows live market data, so it needs a connection. Nothing is shown from a saved copy.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Come back by itself once the connection returns.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
